<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="Beautify GitHub READMEs — a deterministic SVG visual system for repository homepages">
  <title>Beautify GitHub READMEs</title>
  <defs>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="440" rx="24" fill="#FBF9F4"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="23" fill="none" stroke="#E3DCCF" stroke-width="1.5"/>

  <!-- registration crop marks -->
  <g stroke="#8C857A" stroke-width="1.5" fill="none">
    <path d="M28 44 V28 H44"/>
    <path d="M1156 28 H1172 V44"/>
    <path d="M1172 396 V412 H1156"/>
    <path d="M44 412 H28 V396"/>
  </g>

  <!-- left column -->
  <text class="mono" x="72" y="96" font-size="14" letter-spacing="3" fill="#8C857A">OPERIT SKILL / REPOSITORY HOMEPAGES</text>
  <text class="sans" x="70" y="178" font-size="62" font-weight="700" letter-spacing="-1" fill="#191714">Beautify</text>
  <text class="sans" x="70" y="244" font-size="62" font-weight="700" letter-spacing="-1" fill="#191714">GitHub <tspan fill="#D9531F">READMEs</tspan></text>
  <rect x="72" y="264" width="96" height="5" rx="2.5" fill="#D9531F"/>

  <text class="sans" x="72" y="308" font-size="19" fill="#6E675C">Deterministic SVG is the layout system; Markdown</text>
  <text class="sans" x="72" y="334" font-size="19" fill="#6E675C">stays the content layer; generated raster is an</text>
  <text class="sans" x="72" y="360" font-size="19" fill="#6E675C">optional ingredient.</text>

  <!-- mode chips -->
  <g>
    <rect x="72" y="380" width="150" height="34" rx="17" fill="none" stroke="#C9C2B2" stroke-width="1.5"/>
    <text class="mono" x="147" y="402" font-size="12.5" text-anchor="middle" fill="#191714">pure SVG default</text>
    <rect x="234" y="380" width="160" height="34" rx="17" fill="none" stroke="#C9C2B2" stroke-width="1.5"/>
    <text class="mono" x="314" y="402" font-size="12.5" text-anchor="middle" fill="#191714">hybrid on request</text>
    <rect x="406" y="380" width="104" height="34" rx="17" fill="none" stroke="#C9C2B2" stroke-width="1.5"/>
    <text class="mono" x="458" y="402" font-size="12.5" text-anchor="middle" fill="#191714">GIF opt-in</text>
  </g>

  <!-- right: before/after artboards -->
  <!-- before (plain markdown) card, slightly rotated behind -->
  <g transform="rotate(-2 875 219)">
    <rect x="640" y="84" width="470" height="270" rx="14" fill="#F1EDE3" stroke="#E3DCCF" stroke-width="1.5"/>
    <text class="mono" x="664" y="116" font-size="12" fill="#8C857A">before</text>
    <rect x="664" y="136" width="200" height="14" rx="4" fill="#C9C2B2"/>
    <rect x="664" y="168" width="400" height="10" rx="5" fill="#D8D2C4"/>
    <rect x="664" y="192" width="400" height="10" rx="5" fill="#D8D2C4"/>
    <rect x="664" y="216" width="340" height="10" rx="5" fill="#D8D2C4"/>
    <rect x="664" y="240" width="400" height="10" rx="5" fill="#D8D2C4"/>
    <rect x="664" y="264" width="300" height="10" rx="5" fill="#D8D2C4"/>
  </g>

  <!-- after (designed) card -->
  <g>
    <rect x="688" y="132" width="470" height="270" rx="14" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="1.5"/>
    <text class="mono" x="1134" y="164" font-size="12" text-anchor="end" fill="#8C857A">after</text>
    <!-- mini hero block -->
    <rect x="720" y="184" width="210" height="12" rx="3" fill="#D9531F"/>
    <rect x="720" y="212" width="320" height="8" rx="4" fill="#D8D2C4"/>
    <rect x="720" y="230" width="280" height="8" rx="4" fill="#D8D2C4"/>
    <rect x="720" y="248" width="300" height="8" rx="4" fill="#D8D2C4"/>
    <!-- mini chips -->
    <rect x="720" y="278" width="64" height="22" rx="11" fill="#F1EDE3" stroke="#D8D2C4" stroke-width="1"/>
    <rect x="796" y="278" width="64" height="22" rx="11" fill="#F1EDE3" stroke="#D8D2C4" stroke-width="1"/>
    <rect x="872" y="278" width="64" height="22" rx="11" fill="#F1EDE3" stroke="#D8D2C4" stroke-width="1"/>
    <!-- mini diagram: three modules -->
    <rect x="720" y="322" width="96" height="56" rx="10" fill="#FBF9F4" stroke="#E3DCCF" stroke-width="1.5"/>
    <rect x="836" y="322" width="96" height="56" rx="10" fill="#FBF9F4" stroke="#D9531F" stroke-width="2"/>
    <rect x="952" y="322" width="96" height="56" rx="10" fill="#FBF9F4" stroke="#E3DCCF" stroke-width="1.5"/>
    <line x1="820" y1="350" x2="832" y2="350" stroke="#8C857A" stroke-width="1.5"/>
    <path d="M832 350 l-6 -3 v6 z" fill="#8C857A"/>
    <line x1="936" y1="350" x2="948" y2="350" stroke="#8C857A" stroke-width="1.5"/>
    <path d="M948 350 l-6 -3 v6 z" fill="#8C857A"/>
    <text class="mono" x="1134" y="388" font-size="12" text-anchor="end" fill="#8C857A">1200u canvas</text>
  </g>

  <text class="mono" x="1128" y="428" font-size="12" text-anchor="end" fill="#8C857A">renders at GitHub content width, about 900px</text>
</svg>
